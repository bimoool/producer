# Goal Tracker: Postgres + веб + бот. Наружу ничего не публикуется:
# веб — только на 127.0.0.1:3100 (HTTPS отдаёт Caddy на хосте).
# Лимиты памяти — чтобы не мешать другим проектам на сервере (2 ГБ RAM).
name: goaltracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: goaltracker
      POSTGRES_USER: goal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Yekaterinburg
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goal -d goaltracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: goaltracker-tools:latest
    build: { context: ., target: tools }
    environment:
      DATABASE_URL: postgres://goal:${POSTGRES_PASSWORD}@db:5432/goaltracker
    command: ["npx", "tsx", "src/db/migrate.ts"]
    mem_limit: 256m
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    image: goaltracker-web:latest
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://goal:${POSTGRES_PASSWORD}@db:5432/goaltracker
      # Вход через Telegram. Без токена и allowlist вход закрыт полностью.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      APP_URL: ${APP_URL:-https://producer.bimoool.com}
      # Google Sheets (только чтение): ключ сервисного аккаунта, JSON в base64. Без него разделы проекта покажут «не настроено».
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    mem_limit: 384m
    depends_on:
      migrate: { condition: service_completed_successfully }

  bot:
    image: goaltracker-tools:latest
    restart: unless-stopped
    profiles: ["bot"]
    command: ["npx", "tsx", "src/bot/main.ts"]
    environment:
      DATABASE_URL: postgres://goal:${POSTGRES_PASSWORD}@db:5432/goaltracker
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
