# Новый отдельный файл только для producer.bimoool.com — существующие сайты не трогаются.
# HTTPS (listen 443, сертификат, редирект с http) добавит certbot --nginx.

# Ограничение частоты запросов к приложению (дополнительно к блокировке перебора в самом приложении).
limit_req_zone $binary_remote_addr zone=goaltracker_req:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name producer.bimoool.com;

    client_max_body_size 5m;
    # Не пишем Authorization в логи (по умолчанию nginx его и не пишет).
    access_log /var/log/nginx/producer.bimoool.com.access.log;
    error_log  /var/log/nginx/producer.bimoool.com.error.log;

    location / {
        limit_req zone=goaltracker_req burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP перезаписывается адресом клиента — подделать его снаружи нельзя.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
